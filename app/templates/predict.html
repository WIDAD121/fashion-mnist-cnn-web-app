{% extends 'base.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sélectionner Une Image</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
<style>
html {
  font-family: Arial;
  font-size: 16px;
}
.file-upload {
  width: 500px;
  margin-left: 45%;
  padding: 20px;
}

.file-upload-btn {
  width: 100%;
  margin: 0;
  color: #fff;
  background: #1FB264;
  border: none;
  padding: 10px;
  border-radius: 4px;
  border-bottom: 4px solid #15824B;
  transition: all .2s ease;
  outline: none;
  text-transform: uppercase;
  font-weight: 700;
}

.file-upload-btn:hover {
  background: #1AA059;
  color: #ffffff;
  transition: all .2s ease;
  cursor: pointer;
}

.file-upload-btn:active {
  border: 0;
  transition: all .2s ease;
}

.file-upload-content {
  display: none;
  text-align: center;
}

.file-upload-input {
  position: absolute;
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  outline: none;
  opacity: 0;
  cursor: pointer;
}

.image-upload-wrap {
  margin-top: 20px;
  border: 4px dashed #000000;
  position: relative;
  height: 130px;
}

.image-dropping,
.image-upload-wrap:hover {
  background-color: #847bb4;
  border: 4px dashed #ffffff;
}

.image-title-wrap {
  padding: 0 15px 15px 15px;
  color: #222;
}

.drag-text {
  text-align: center;
}

.drag-text h3 {
    text-transform: uppercase;
    color: #000000;
    padding-top: 34px;
    font-size: 22px;
}

.file-upload-image {
  max-height: 200px;
  max-width: 200px;
  margin: auto;
  padding: 20px;
}

.remove-image {
  width: 200px;
  margin: 0;
  color: #fff;
  background: #312450;
  border: none;
  padding: 10px;
  border-radius: 4px;
  border-bottom: 4px solid #312450;
  transition: all .2s ease;
  outline: none;
  text-transform: uppercase;
  font-weight: 700;
}

.remove-image:hover {
  background: #312450;
  color: #ffffff;
  transition: all .2s ease;
  cursor: pointer;
}

.remove-image:active {
  border: 0;
  transition: all .2s ease;
}
h1{
    margin-left: 28%;
}
.btn-primary{
  width: 203px;
  margin: 0;
  color: #fff;
  background: #312450;
  border: none;
  padding: 10px;
  border-radius: 4px;
  border-bottom: 4px solid #312450;
  transition: all .2s ease;
  outline: none;
  text-transform: uppercase;
  font-weight: 700;
  margin-left: 58.5%;
}
.btn-primary:hover {
  background: #312450;
  color: #ffffff;
  transition: all .2s ease;
  cursor: pointer;
}
.btn-primary:active{
  border: 0;
  transition: all .2s ease;
}
#predictedProduct{
  margin-left: 40%;
}
</style>
</head>
<body>

<div class="container mt-5">
  <h1 class="mb-4">Veuillez Importer une image à Prédicter</h1>
  
  <form id="imageForm" action="/predict" method="post" enctype="multipart/form-data">
    <div class="file-upload">
        <div class="image-upload-wrap">
            <input class="file-upload-input" type="file" onchange="readURL(this);" accept="image/*" name="image" />
            <div class="drag-text">
                <h3>Faites glisser et déposez un fichier ou sélectionnez une image</h3>
            </div>
        </div>
        <div class="file-upload-content">
            <img class="file-upload-image img-thumbnail" src="#" alt="Uploaded Image" style="max-width: 300px;">
            <div class="image-title-wrap mt-2">
                <button type="button" onclick="removeUpload()" class="btn btn-danger remove-image">Effacer <span class="image-title">Uploaded Image</span></button>
            </div>
        </div>
    </div>
    <button type="button" id="submitButton" class="btn btn-primary" style="display: none;">Prédicter</button>
  </form>
  <div id="predictionResult" style="display: none;">
    <h1>Résultat de Prédiction</h1>
    <h3 id="predictedProduct"></h3>
</div>
</div>
  



<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
  function readURL(input) {
      if (input.files && input.files[0]) {
          var reader = new FileReader();
          
          reader.onload = function(e) {
              $('.image-upload-wrap').hide();
              $('.file-upload-image').attr('src', e.target.result);
              $('.file-upload-content').show();
              $('.image-title').html(input.files[0].name);
              $('#submitButton').show();
          }
          
          reader.readAsDataURL(input.files[0]);
      } else {
          removeUpload();
      }
  }

  function removeUpload() {
      $('.file-upload-input').replaceWith($('.file-upload-input').clone());
      $('.file-upload-content').hide();
      $('.image-upload-wrap').show();
      $('#submitButton').hide();
      $('#predictionResult').hide(); 
  }

  $('.image-upload-wrap').bind('dragover', function () {
      $('.image-upload-wrap').addClass('image-dropping');
  });

  $('.image-upload-wrap').bind('dragleave', function () {
      $('.image-upload-wrap').removeClass('image-dropping');
  });

  $('#submitButton').click(function() {
      var formData = new FormData($('#imageForm')[0]);
      $.ajax({
          type: 'POST',
          url: '/predict',
          data: formData,
          contentType: false,
          processData: false,
          success: function(response) {
              $('#predictedProduct').text("C'est un : " + response.product);
              $('#predictionResult').show();
          },
          error: function(xhr, status, error) {
              console.error(xhr.responseText);
          }
      });
  });
</script>
  

</body>
</html>


{% endblock %}
